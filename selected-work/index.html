<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Selected Work — brand, campaign and visual design across packaging, retail, digital and print."
    />
    <title>Selected Work — Dot.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../freedom-50/styles.css?v=selected-work-1" />
    <link rel="stylesheet" href="theme.css?v=selected-work-1" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-mark" href="#top">Dot.</a>
        <button
          class="menu-button"
          type="button"
          aria-label="Menu"
          aria-expanded="false"
          aria-disabled="true"
        >
          <span class="menu-button__line" aria-hidden="true"></span>
          <span class="menu-button__line" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- OPENING -->
      <section
        class="section section--selected-hero"
        id="top"
        aria-labelledby="selected-title"
      >
        <div class="section__inner">
          <p class="eyebrow reveal">03 — Selected Work</p>
          <h1 class="hero__title reveal" id="selected-title">
            Selected<br />
            Work
          </h1>
          <p class="lede reveal">
            Brand, campaign and visual design across different industries and
            formats — from packaging and retail to digital, print and the
            occasional odd brief.
          </p>
        </div>
      </section>

      <!-- VISUAL SEQUENCE -->
      <section class="section section--work" aria-label="Selected work">
        <div class="work-stack">
          <!-- 1. Hero -->
          <figure class="work-visual work-visual--hero reveal">
            <picture>
              <source
                srcset="images/selected-boochos-hero.webp"
                type="image/webp"
              />
              <img
                src="images/selected-boochos-hero.png"
                alt="Boochos food trailer with sugar-skull livery on a magenta field."
                width="1672"
                height="941"
                decoding="async"
                fetchpriority="high"
              />
            </picture>
          </figure>

          <!-- 2–3. Packaging pair -->
          <div class="work-pair">
            <figure class="work-visual work-visual--mid reveal">
              <picture>
                <source
                  srcset="images/selected-botanic-packaging.webp"
                  type="image/webp"
                />
                <img
                  src="images/selected-botanic-packaging.png"
                  alt="Botanic Co. let it glow packaging on a pink field."
                  width="845"
                  height="511"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
            </figure>
            <figure class="work-visual work-visual--mid reveal">
              <picture>
                <source
                  srcset="images/selected-wicked-bun-cups.webp"
                  type="image/webp"
                />
                <img
                  src="images/selected-wicked-bun-cups.png"
                  alt="Wicked Bun cups with running burger illustration."
                  width="1448"
                  height="1086"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
            </figure>
          </div>

          <!-- 4. SootAway — larger beat -->
          <figure class="work-visual work-visual--feature reveal">
            <picture>
              <source
                srcset="images/selected-soot-away-van.webp"
                type="image/webp"
              />
              <img
                src="images/selected-soot-away-van.png"
                alt="SootAway chimney services van wrap."
                width="1610"
                height="977"
                loading="lazy"
                decoding="async"
              />
            </picture>
          </figure>

          <!--
            MOTION SLOT A — rocket / space animation
            When ready, place inside this figure (do not leave data-empty):
            <video autoplay muted loop playsinline>
              <source src="images/selected-motion-rocket.mp4" type="video/mp4" />
            </video>
          -->
          <figure
            class="work-motion"
            data-motion="rocket"
            aria-hidden="true"
          ></figure>

          <!-- 5–6. Merchandise pair -->
          <div class="work-pair">
            <figure class="work-visual work-visual--mid reveal">
              <picture>
                <source
                  srcset="images/selected-wristband.webp"
                  type="image/webp"
                />
                <img
                  src="images/selected-wristband.png"
                  alt="Colourful geometric festival wristband."
                  width="1598"
                  height="984"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
            </figure>
            <figure class="work-visual work-visual--mid reveal">
              <picture>
                <source
                  srcset="images/selected-punkt-hoodie.webp"
                  type="image/webp"
                />
                <img
                  src="images/selected-punkt-hoodie.png"
                  alt="Punkt creative space hoodie on yellow."
                  width="1563"
                  height="1006"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
            </figure>
          </div>

          <!-- 7. Food delivery van — landscape moment -->
          <figure class="work-visual work-visual--feature reveal">
            <picture>
              <source
                srcset="images/selected-food-delivery-van.webp"
                type="image/webp"
              />
              <img
                src="images/selected-food-delivery-van.png"
                alt="On Wheels food delivery vehicle wrap."
                width="1598"
                height="984"
                loading="lazy"
                decoding="async"
              />
            </picture>
          </figure>

          <!--
            MOTION SLOT B — child / education animation
            When ready, place inside this figure:
            <video autoplay muted loop playsinline>
              <source src="images/selected-motion-education.mp4" type="video/mp4" />
            </video>
          -->
          <figure
            class="work-motion"
            data-motion="education"
            aria-hidden="true"
          ></figure>

          <!-- 8. Derma retail -->
          <figure class="work-visual work-visual--feature reveal">
            <picture>
              <source
                srcset="images/selected-derma-retail.webp"
                type="image/webp"
              />
              <img
                src="images/selected-derma-retail.png"
                alt="Derma+ interactive retail kiosk in store."
                width="1564"
                height="1006"
                loading="lazy"
                decoding="async"
              />
            </picture>
          </figure>

          <!-- 9. BPerfect campaign — portrait -->
          <figure class="work-visual work-visual--portrait reveal">
            <picture>
              <source
                srcset="images/selected-bperfect-campaign.webp"
                type="image/webp"
              />
              <img
                src="images/selected-bperfect-campaign.png"
                alt="BPerfect Cosmetics free gift campaign graphic."
                width="945"
                height="1665"
                loading="lazy"
                decoding="async"
              />
            </picture>
          </figure>
        </div>
      </section>

      <section class="section section--selected-end">
        <nav class="project-nav" aria-label="Project navigation">
          <div class="section__inner">
            <p class="project-nav__label">Back to</p>
            <a class="project-nav__link" href="../freedom-50/">Freedom 50 →</a>
          </div>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="section__inner">
        <p class="site-footer__note">Selected Work</p>
      </div>
    </footer>

    <script src="../freedom-50/main.js" defer></script>
  </body>
</html>
